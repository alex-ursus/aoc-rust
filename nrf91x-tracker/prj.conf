# =============================================================================
# Application
# =============================================================================
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=65536
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# =============================================================================
# LTE / Modem (nRF9161)
# =============================================================================
CONFIG_NRF_MODEM_LIB=y
CONFIG_LTE_LINK_CONTROL=y
CONFIG_LTE_AUTO_INIT_AND_CONNECT=n
CONFIG_LTE_NETWORK_MODE_LTE_M=y
CONFIG_LTE_NETWORK_USE_FALLBACK=y
CONFIG_MODEM_INFO=y
CONFIG_MODEM_INFO_ADD_DEVICE=y
CONFIG_MODEM_INFO_ADD_NETWORK=y

# =============================================================================
# GNSS (nRF9161 integrated)
# =============================================================================
CONFIG_NRF_CLOUD_AGPS=n
CONFIG_GNSS=y
CONFIG_NRF9160_GPS=y

# =============================================================================
# Bluetooth scanning (nRF5340)
# =============================================================================
CONFIG_BT=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_CENTRAL=n
CONFIG_BT_PERIPHERAL=n
CONFIG_BT_EXT_ADV=y
CONFIG_BT_SCAN_MAX_RESULTS=20
CONFIG_BT_DEVICE_NAME="thingy91x-tracker"

# =============================================================================
# Environmental sensor (BME688 on Thingy:91X)
# =============================================================================
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_BME680=y

# =============================================================================
# Networking / TLS / HTTPS
# =============================================================================
CONFIG_NETWORKING=y
CONFIG_NET_NATIVE=n
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_SOCKETS_TLS=y
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=32768
CONFIG_HTTP_CLIENT=y
CONFIG_NET_SOCKETS_POSIX_NAMES=y

# TLS credentials
CONFIG_TLS_CREDENTIALS=y
CONFIG_MODEM_KEY_MGMT=y

# =============================================================================
# DNS
# =============================================================================
CONFIG_DNS_RESOLVER=y
CONFIG_DNS_RESOLVER_MAX_SERVERS=1

# =============================================================================
# Timers / GPIO / Buttons
# =============================================================================
CONFIG_GPIO=y
CONFIG_DK_BUTTONS_AND_LEDS=y

# =============================================================================
# Logging
# =============================================================================
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_BACKEND_UART=y
CONFIG_UART_CONSOLE=y
CONFIG_SERIAL=y

# =============================================================================
# Date/Time (for timestamps)
# =============================================================================
CONFIG_DATE_TIME=y
CONFIG_DATE_TIME_AUTO_UPDATE=y

# =============================================================================
# JSON
# =============================================================================
CONFIG_CJSON_LIB=y

# =============================================================================
# Settings (persist device ID etc.)
# =============================================================================
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
